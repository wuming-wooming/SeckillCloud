spring:
  application:
    name: seckill-user
  config:
    # 格式：optional:nacos:/{dataId}?group={group}&namespace={namespace}
    import: "optional:nacos:/seckill-user.yml?group=DEFAULT_GROUP&namespace=public"
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
      discovery:
        username: nacos
        password: nacos
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/micro_db
    username: dev
    password: dev123456
server:
  port: 8888

