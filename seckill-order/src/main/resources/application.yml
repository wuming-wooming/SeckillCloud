spring:
  application:
    name: seckill-order
  config:
    import:
      - nacos:seckill-common.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:seckill-order.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        namespace: dev
      config:
        namespace: dev
        group: DEFAULT_GROUP
        file-extension: yml