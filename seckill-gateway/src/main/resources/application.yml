server:
  port: 8081

spring:
  application:
    name: seckill-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        namespace: dev
    gateway:
      server:
        webmvc:
          routes:
            - id: seckill-user
              uri: lb://seckill-user
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=1
            - id: seckill-product
              uri: lb://seckill-product
              predicates:
                - Path=/api/product/**
              filters:
                - StripPrefix=1
            - id: seckill-seckill
              uri: lb://seckill-seckill
              predicates:
                - Path=/api/seckill/**
              filters:
                - StripPrefix=1
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600